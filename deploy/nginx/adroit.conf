# nginx reverse proxy for Option B (no Docker). Certificates via certbot: certbot --nginx -d hr.adroit.ae
server {
    listen 80;
    server_name hr.adroit.ae;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name hr.adroit.ae;

    ssl_certificate     /etc/letsencrypt/live/hr.adroit.ae/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hr.adroit.ae/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 60m;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
