# Production stack: PostgreSQL + application + HTTPS reverse proxy + nightly backups.
#   cd deploy && cp .env.example .env   (fill in the values)
#   docker compose up -d --build
#   docker compose logs app | grep "temporary password"     (first start only)
name: adroit

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-adroit}
      POSTGRES_USER: ${POSTGRES_USER:-adroit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      TZ: ${TZ:-Asia/Dubai}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: adroit-platform:${APP_VERSION:-1.0.0}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-adroit}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-adroit}
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
    volumes:
      - files:/data/files
      - backups:/backups:ro
    networks: [internal]

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-adroit}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-adroit}
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
      BACKUP_TIME: ${BACKUP_TIME:-02:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      TZ: ${TZ:-Asia/Dubai}
    volumes:
      - ./scripts:/scripts:ro
      - files:/data/files:ro
      - backups:/backups
    entrypoint: ["/bin/sh", "/scripts/backup-loop.sh"]
    networks: [internal]

  # one-off tool for disaster recovery (not started by "up"):
  #   docker compose stop app
  #   docker compose run --rm restore /scripts/restore.sh /backups/<file>.dump /backups/<files>.tar.gz
  #   docker compose start app
  restore:
    image: postgres:16-alpine
    profiles: [tools]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-adroit}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB:-adroit}
      FILES_DIR: /data/files
      BACKUP_DIR: /backups
    volumes:
      - ./scripts:/scripts:ro
      - files:/data/files
      - backups:/backups
    entrypoint: ["/bin/sh"]
    networks: [internal]

volumes:
  db-data:
  files:
  backups:
  caddy-data:
  caddy-config:

networks:
  internal:
